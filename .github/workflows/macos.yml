name: Build macOS apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Build, verify architecture and sign ad hoc
        run: bash scripts/build_macos.sh "${{ matrix.arch }}"
      - name: Upload build artifacts (gameplay remains unverified)
        uses: actions/upload-artifact@v4
        with:
          name: Herspers-Minecraft-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.zip
          if-no-files-found: error
