name: Build Herps Felled Windows installer
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed Windows build run to export as a direct EXE
        type: string
        required: false
      quick_build:
        description: Use lower compiler optimization for an earlier test build
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    if: ${{ inputs.source_run == '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_FAST_OPT_LEVEL: ${{ inputs.quick_build && '1' || '3' }}
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the Windows client and server
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify the packaged Windows binaries
        shell: pwsh
        run: ./scripts/smoke_windows.ps1 -PackagePath dist/windows-x86_64/Herspers-Minecraft
      - name: Bundle Herps Launcher
        shell: pwsh
        run: |
          python -m pip install -r herps_launcher/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_herps.py --game dist/windows-x86_64/Herspers-Minecraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the single-file installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $payload = Get-ChildItem dist/herps -Directory | Where-Object Name -Like 'herps-*' | Select-Object -First 1
          if (-not $payload) { throw 'Launcher payload missing' }
          $shortPayload = Join-Path $env:RUNNER_TEMP 'felled-payload'
          python -c 'import shutil,sys; shutil.copytree(sys.argv[1],sys.argv[2])' $payload.FullName $shortPayload
          $limits = python tools/windows_installer.py $shortPayload | ConvertFrom-Json
          $spec = Join-Path $env:RUNNER_TEMP 'herps-felled.iss'
          $source = Get-Content -Raw packaging/herps-windows.iss
          $source = $source.Replace('AppId=io.herspers.herps-launcher', 'AppId=io.herspers.herps-felled').Replace('AppName=Herps Launcher', 'AppName=Herps Felled').Replace('Programs\Herps Launcher', 'Programs\Herps Felled').Replace('DefaultGroupName=Herps Launcher', 'DefaultGroupName=Herps Felled').Replace('Herps-Launcher-0.1.0-Windows-x64-Setup', 'Herps-Felled-26.3-Windows-x64-Setup')
          Set-Content -LiteralPath $spec -Value $source -Encoding utf8BOM
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $compiler "/DMaxPayloadFileChars=$($limits.file_chars)" "/DMaxPayloadDirChars=$($limits.directory_chars)" "/DPayload=$shortPayload" "/DOutput=$((Resolve-Path dist/herps).Path)" $spec
          Get-FileHash dist/herps/Herps-Felled-26.3-Windows-x64-Setup.exe -Algorithm SHA256
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Herps-Felled-Windows-x64-Setup
          path: dist/herps/Herps-Felled-26.3-Windows-x64-Setup.exe
          if-no-files-found: error

  download-file:
    if: ${{ inputs.source_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the completed installer build
        uses: actions/download-artifact@v4
        with:
          name: Herps-Felled-Windows-x64-Setup
          path: installer
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify the installer file
        run: |
          set -eu
          setup=installer/Herps-Felled-26.3-Windows-x64-Setup.exe
          test "$(head -c 2 "$setup")" = MZ
          sha256sum "$setup"
      - name: Upload the installer as a direct EXE download
        uses: actions/upload-artifact@v7
        with:
          path: installer/Herps-Felled-26.3-Windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
